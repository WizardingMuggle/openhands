<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Button to PR</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    align-items: flex-start; padding: 48px 20px;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e8eb;
  }
  .card { width: 100%; max-width: 620px; background: #171a21; border: 1px solid #262b36;
          border-radius: 14px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.sub { margin: 0 0 22px; color: #98a2b3; font-size: 13px; }
  label { display: block; margin: 14px 0 6px; font-size: 12px; color: #98a2b3;
          text-transform: uppercase; letter-spacing: .04em; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #2c3340;
    background: #0f1319; color: #e6e8eb; font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: #4f7cff; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .row > div { flex: 1; }
  .hint { margin-top: 6px; font-size: 12px; color: #6b7280; }
  button {
    margin-top: 20px; width: 100%; padding: 12px 16px; border: 0; border-radius: 10px;
    background: #4f7cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.secondary {
    width: auto; margin-top: 0; padding: 10px 14px; background: #2c3340; color: #e6e8eb;
    white-space: nowrap;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .status { margin-top: 22px; border-top: 1px solid #262b36; padding-top: 18px; font-size: 14px; }
  .status:empty { display: none; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px;
           font-weight: 600; background: #2c3340; }
  .badge.running { background: #3a2f10; color: #f5c451; }
  .badge.ok { background: #10331f; color: #4ade80; }
  .badge.err { background: #3a1517; color: #f87171; }
  a { color: #7aa2ff; }
  .kv { margin-top: 10px; color: #98a2b3; font-size: 13px; }
  code { background: #0f1319; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Button to Pull Request</h1>
    <p class="sub">Pressing the button starts an OpenHands Cloud run against your repo and reports the PR back here.</p>

    <label for="provider">Git provider</label>
    <select id="provider">
      <option value="github">GitHub</option>
      <option value="azure_devops">Azure DevOps</option>
    </select>

    <label for="repo">Repository</label>
    <input id="repo" placeholder="octocat/hello-world" autocomplete="off" />
    <div class="hint" id="repo-hint"></div>

    <label for="token">Personal access token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" />
    <div class="hint" id="token-hint"></div>

    <label for="branch">Base branch</label>
    <div class="row">
      <div>
        <select id="branch">
          <option value="">Repository default branch</option>
        </select>
      </div>
      <button type="button" id="load-branches" class="secondary">Load branches</button>
    </div>
    <div class="hint" id="branch-hint"></div>

    <label for="instruction">What should the agent do?</label>
    <textarea id="instruction" placeholder="Add a CONTRIBUTING.md with setup and test instructions."></textarea>

    <button id="go">Create pull request</button>

    <section class="status" id="status"></section>
  </main>

<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;

const PROVIDERS = {
  github: {
    label: "GitHub",
    repoPlaceholder: "octocat/hello-world",
    repoHint: "owner/name",
    tokenLabel: "GitHub token",
    tokenHint: "Optional for public repos. Needed for private repos and to list branches.",
  },
  azure_devops: {
    label: "Azure DevOps",
    repoPlaceholder: "contoso/web/PetStore",
    repoHint: "organization/project/repository",
    tokenLabel: "Azure DevOps PAT",
    tokenHint: "Required to list branches and to push. Set AZURE_DEVOPS_TOKEN on the server to skip this.",
  },
};

function applyProvider() {
  const cfg = PROVIDERS[$("provider").value];
  $("repo").placeholder = cfg.repoPlaceholder;
  $("repo-hint").textContent = `Format: ${cfg.repoHint}`;
  $("token").placeholder = cfg.tokenLabel;
  $("token-hint").textContent = cfg.tokenHint;
  resetBranches();
}

function resetBranches() {
  const sel = $("branch");
  sel.innerHTML = '<option value="">Repository default branch</option>';
  $("branch-hint").textContent = "";
}

function renderBranches(branches) {
  const sel = $("branch");
  resetBranches();
  for (const name of branches) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  }
  $("branch-hint").textContent = branches.length
    ? `${branches.length} branch(es). Pick the base branch for the new PR.`
    : "No branches found. The agent will use the repository default branch.";
}

async function loadBranches() {
  const provider = $("provider").value;
  const repo = $("repo").value.trim();
  const token = $("token").value.trim();
  if (!repo) {
    $("branch-hint").textContent = "Enter a repository first.";
    return;
  }
  $("load-branches").disabled = true;
  $("branch-hint").textContent = "Loading branches...";
  try {
    const resp = await fetch("/api/branches", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider, repo, token }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    renderBranches(data.branches || []);
  } catch (err) {
    $("branch-hint").textContent = `Could not load branches: ${err.message}`;
  } finally {
    $("load-branches").disabled = false;
  }
}

function badgeClass(status) {
  if (status === "pr_found" || status === "finished") return "badge ok";
  if (status === "error" || status === "stuck" || status === "timeout" || status === "stopped") return "badge err";
  return "badge running";
}

function render(run) {
  const el = $("status");
  const bits = [`<span class="${badgeClass(run.status)}">${run.status}</span>`];
  if (run.execution_status && run.status === "running") bits.push(`execution: ${run.execution_status}`);
  if (run.error) bits.push(`<div class="kv" style="color:#f87171">${run.error}</div>`);
  if (run.conversation_ui_url) {
    bits.push(`<div class="kv">Conversation: <a href="${run.conversation_ui_url}" target="_blank" rel="noreferrer">${run.conversation_ui_url}</a></div>`);
  }
  if (run.pr_url) {
    bits.push(`<div class="kv">Pull request: <a href="${run.pr_url}" target="_blank" rel="noreferrer">${run.pr_url}</a></div>`);
  }
  el.innerHTML = bits.join(" ");
}

function poll(runId) {
  clearTimeout(pollTimer);
  fetch(`/api/status/${runId}`)
    .then((r) => r.json())
    .then((run) => {
      render(run);
      const done = ["pr_found", "finished", "error", "timeout", "stuck", "stopped"].includes(run.status);
      if (!done) pollTimer = setTimeout(() => poll(runId), 3000);
      else $("go").disabled = false;
    })
    .catch(() => { pollTimer = setTimeout(() => poll(runId), 5000); });
}

$("provider").addEventListener("change", applyProvider);
$("load-branches").addEventListener("click", loadBranches);
applyProvider();

$("go").addEventListener("click", async () => {
  const body = {
    provider: $("provider").value,
    repo: $("repo").value.trim(),
    branch: $("branch").value.trim(),
    token: $("token").value.trim(),
    instruction: $("instruction").value.trim(),
  };
  if (!body.repo || !body.instruction) {
    $("status").innerHTML = '<span class="badge err">error</span> repo and instruction are required';
    return;
  }
  $("go").disabled = true;
  $("status").innerHTML = '<span class="badge running">queued</span>';
  try {
    const resp = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    poll(data.run_id);
  } catch (err) {
    $("status").innerHTML = `<span class="badge err">error</span> ${err.message}`;
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
